     <script>
        //Stores the information of the API 
        let allAnime = {};
        //Useses the content body to organize the information.
        const container = document.querySelector(".ContentBody");

         /**
         * Function fetches the data from the URL and places the data in the allanime object
         * calls the load function to display
         * 
        */
        async function FetchSeasons()
        {
            //API url
            const url = "https://api.jikan.moe/v4/seasons/upcoming";
            const options =
            {
                method: 'GET',
            };
            //fetch command that gathers the data from the API in the URL, using the GET command.
            const response = await fetch(url, options);
            //Result collects the JSON data from the API
            const result = await response.text();
            //parse the json data into javascript object format.
            const myObj = JSON.parse(result);
            // console.log(myObj)
            // console.log(myObj.data.length);
            //sends the data from in myObj to be stored in the allAnime object, allowing for the use of the data without having to fetch the API again
            allAnime = myObj;
            //Follows the DOM of the JSON to grab the image from the first listed data
            const imageUrl = myObj.data[0].images.jpg.image_url;
            //Call load function with container and myObj as the parameters.
            loadFunctions(container, myObj);
            //container.innerHTML = `<img src="${imageUrl}" alt = "Anime Image">`;

            //Used to find the api data when inspecting the page
            console.log("HERE IS YOUR DATA!");
            console.log(myObj.data[0]);
            //fetch("https://api.jikan.moe/v4/seasons/upcoming")
            //.then(res => console.log(res))
        }
        //calls the fetch seasons function
        FetchSeasons()

        //Function to load in and display the data.
        function loadFunctions(container, object){
            //content is a blank string to allow each card to be appended in to this string
            var content = "";
            console.log(object.data.length);
            //for loop used to create variables to contain the api data
            for(var i=0; i < object.data.length; i++)
            {
                //variables for API data
                let AnimeImage;
                let AnimeTitle;
                let AnimeScource;
                let AnimeTVRating;
                let AnimeGenere = [];
                let AnimeThemes = [];

            //loads the data of the api into the variable, as the loop continues, it moves on to the next set of data
               AnimeImage = object.data[i].images.jpg.image_url;
               AnimeTitle = object.data[i].title;
               AnimeScource = object.data[i].source;
               AnimeTVRating = object.data[i].rating;
               console.log(object.data[i].genres.length);

            //genere and themes require a second for loop, because there are multiple of them that need to be listed
               for(var j=0; j < object.data[i].genres.length; j++)
               {
                    AnimeGenere.push(object.data[i].genres[j].name);
               }
               //if the themes is empty, N/A is displayed instead
               if(  object.data[i].themes.length == 0)
                    AnimeThemes.push("N/A");
               else
               {
                for(var k=0; k < object.data[i].themes.length; k++)
                {
                    AnimeThemes.push(object.data[i].themes[k].name);
                }
               }

               console.log(AnimeImage);
               console.log(AnimeTitle);
               console.log(AnimeScource);
               console.log(AnimeTVRating);
               console.log(AnimeGenere);
               console.log(AnimeThemes);

            //Displays the data in a Card style, so all the information is gathered neatly.
            var card = `<div class="card" style="width: 18rem;">
            <img src="${AnimeImage}" class="card-img-top" alt="...">
            <div class="card-body">
            <h5 class="card-title">Tile: ${AnimeTitle}</h5>
            </div>
            <ul class="list-group list-group-flush">
            <li class="list-group-item">Source: ${AnimeScource}</li>
            <li class="list-group-item">Rating: ${AnimeTVRating}</li>
            <li class="list-group-item">Genere: ${AnimeGenere}</li>
            <li class="list-group-item">Themes: ${AnimeThemes}<li>
            </ul>
            </div>`;

            //sends the data put into card to be displayed in content
            content += card;

            }
            //displays the cards on the web page.
            container.innerHTML = content;
        }
         //Function for the search bar that takes in an input from the user
        //Searches the Anime by its name
        function search(input)
        {
            let found = false;

            //For loop used to search the already collected data from the API,
            for(var i=0; i < allAnime.data.length; i++)
            {
                let AnimeTitle = allAnime.data[i].title;
                //If the title input by the user matches the data, then the data found gets displayed
                if( input == AnimeTitle)
                {   
                    container.innerHTML = "";

                    found = true;

                    let AnimeImage;
                    let AnimeTVRating;
                    let AnimeGenere = [];
                    let AnimeThemes = [];

                    AnimeImage = allAnime.data[i].images.jpg.image_url;
                    AnimeTitle = allAnime.data[i].title;
                    AnimeScource = allAnime.data[i].source;
                    AnimeTVRating = allAnime.data[i].rating;
                    
                    for(var j=0; j < allAnime.data[i].genres.length; j++)
                    {
                            AnimeGenere.push(allAnime.data[i].genres[j].name);
                    }

                    if(  allAnime.data[i].themes.length == 0)
                            AnimeThemes.push("N/A");
                    else
                    {
                        for(var k=0; k < allAnime.data[i].themes.length; k++)
                        {
                            AnimeThemes.push(allAnime.data[i].themes[k].name);
                        }
                    }

                    var card = `<div class="card mx-auto" style="width: 18rem;">
                    <img src="${AnimeImage}" class="card-img-top" alt="...">
                    <div class="card-body">
                    <h5 class="card-title">Tile: ${AnimeTitle}</h5>
                    </div>
                    <ul class="list-group list-group-flush">
                    <li class="list-group-item">Source: ${AnimeScource}</li>
                    <li class="list-group-item">Rating: ${AnimeTVRating}</li>
                    <li class="list-group-item">Genere: ${AnimeGenere}</li>
                    <li class="list-group-item">Themes: ${AnimeThemes}<li>
                    </ul>
                    </div>`;

                    //content += card;

                    }
                    container.innerHTML = card;
            }
            
            //if the inputed title does not match any of the data, the window pops up warninng the user as such, and no information is displayed.
            if( found == false)
                window.alert("No Anime with that name");
    }
        //resets the displayed data.
        function resetData()
        {
            loadFunctions(container, allAnime);
        }
